[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sok-core"
version = "0.1.0"
description = "Platforma: prepoznavanje plugin-ova, pretraga i filtriranje grafa."
requires-python = ">=3.11"
dependencies = ["sok-api==0.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sok*"]
namespaces = true
