[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sok-xml-datasource"
version = "0.1.0"
description = "Data source plugin koji pravi graf iz XML dokumenta."
requires-python = ">=3.11"
dependencies = ["sok-api==0.1.0"]

[project.entry-points."sok.datasource"]
xml = "sok.datasource.xml.plugin:XmlDataSource"

[tool.setuptools.packages.find]
where = ["."]
include = ["sok*"]
namespaces = true
